name: Update events count

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Count this month's art & culture events
        run: python3 events_bot.py
      - name: Save the new count
        run: |
          git config user.name "accbc-events-bot"
          git config user.email "admin@artandculturebc.com"
          git add docs/events.json
          git diff --cached --quiet || git commit -m "Update events count"
          git push
